<header><h1>Caderno de Análise no Espaço de Estados</h1><p>MCSDI · 40 exercícios resolvidos passo a passo, com teoria e simulação em cada um</p></header>
<main><div id="nav"></div><div id="ex"></div></main>
<script>
const $=i=>document.getElementById(i),r=x=>Math.abs(x)<1e-9?0:+x.toFixed(3);
const T={
vp:['Valores e vetores próprios','Valores próprios: det(λI−A)=0. Vetor próprio: (λI−A)v=0, isto é Av=λv: A só estica v, não o roda. Triangular/diagonal: os λ estão na diagonal. Os λ de A são os polos do sistema.'],
fc:['Formas canónicas','Com Y/U=(b₀sⁿ+…+bₙ)/(sⁿ+a₁sⁿ⁻¹+…+aₙ): <b>controlável</b> A=[superdiagonal de 1; última linha −aₙ…−a₁], B=[0…0 1]ᵀ, C=[bₙ−aₙb₀ … b₁−a₁b₀], D=b₀. <b>Observável</b> é a dual: A=[−a₁ 1 0; −a₂ 0 1; −aₙ 0 0], B=[b₁−a₁b₀; …; bₙ−aₙb₀], C=[1 0 … 0].'],
bd:['Diagramas de blocos','Cada integrador ∫ é uma variável de estado. ẋᵢ = soma das setas que entram no somador (ganho×estado + ganho×u); y = soma ponderada dos estados (+ D·u se houver ramo direto). Nota: setas com sinal − no somador dão ganhos negativos.'],
ci:['Circuitos elétricos','Um estado por elemento armazenador: condensador→v_C, bobina→i_L. Relações: i=C·dv/dt, v=L·di/dt. Escrever KVL nas malhas e KCL nos nós, eliminar as variáveis que não são estado e isolar ẋ.'],
ft:['Função de transferência','G(s)=C(sI−A)⁻¹B+D = det[sI−A −B; C D]/det(sI−A) (sem inverter). Polos = valores próprios de A. Cancelamento polo-zero ⇒ o sistema perde controlabilidade e/ou observabilidade.'],
ex:['Matriz exponencial e resposta','Φ(t)=e^(At)=ℒ⁻¹{(sI−A)⁻¹} ou Cayley-Hamilton: e^(At)=α₀I+α₁A com e^(λᵢt)=α₀+α₁λᵢ. Solução: x(t)=Φ(t)x(0)+∫₀ᵗΦ(t−τ)Bu(τ)dτ. Propriedades: Φ(0)=I, Φ⁻¹(t)=Φ(−t).'],
cr:['Controlabilidade e observabilidade','Q=[B AB … Aⁿ⁻¹B]: controlável ⇔ car(Q)=n (SISO: det Q≠0). R=[C; CA; …; CAⁿ⁻¹]: observável ⇔ car(R)=n. Na forma diagonal com λ distintos: controlável ⇔ todos bᵢ≠0; observável ⇔ todos cᵢ≠0.'],
dg:['Diagonalização','Com T=[v₁ … vₙ] (vetores próprios): Λ=T⁻¹AT, B̃=T⁻¹B, C̃=CT, x=Tz. Modos desacoplados zᵢ=e^(λᵢt)zᵢ(0). Complexos conjugados dão e^(σt)cos(ωt) e e^(σt)sin(ωt).'],
st:['Estabilidade','Estável ⇔ todos os Re(λ)&lt;0. Basta um Re(λ)&gt;0 para ser instável. Par complexo com Re&lt;0: subamortecido (oscila e amortece); reais negativos: sem oscilação.']};
const S=(A,B,C,D,x0,u,T)=>({A,B,C,D,x0,u,T:T||6});
const E={};const add=(n,t,k,s,m)=>E[n]={t,k,s,m};
const G3=[[0,1,0],[0,0,1],[-15,-11,-5]],A21=[[-9,1,0],[-26,0,1],[-24,0,0]];
add(1,'Valores e vetores próprios','vp',['det(λI−A)=λ²+6λ+8=(λ+2)(λ+4) ⇒ <b>λ₁=−2, λ₂=−4</b>.','λ=−2: 4x₁−4x₂=0 ⇒ <b>v₁=[1 1]ᵀ</b>. λ=−4: 2x₁−4x₂=0 ⇒ <b>v₂=[2 1]ᵀ</b>.','b) A[1 1]ᵀ=[−2 −2]ᵀ=−2v₁ e A[2 1]ᵀ=[−8 −4]ᵀ=−4v₂ (só esticam). A[1 2]ᵀ=[2 −2]ᵀ muda de direção: não é vetor próprio.'],S([[-6,4],[-2,0]],[0,1],[1,0],0,[1,2],0));
add(2,'Formas canónicas (3.ª ordem)','fc',['ȳ+9ÿ+26ẏ+24y=u̇+4u ⇒ a=(9,26,24), b₀=0, b₁=0, b₂=1, b₃=4.','a) Controlável: A=[0 1 0;0 0 1;−24 −26 −9], B=[0 0 1]ᵀ, C=[b₃ b₂ b₁]=[4 1 0] ⇒ <b>opção A</b>.','b) Observável: A=[−9 1 0;−26 0 1;−24 0 0], B=[b₁ b₂ b₃]ᵀ=[0 1 4]ᵀ, C=[1 0 0] ⇒ <b>opção B</b>.'],S([[0,1,0],[0,0,1],[-24,-26,-9]],[0,0,1],[4,1,0],0,[0,0,0],1,6));
add(3,'FT → formas canónicas','fc',['(s+3)/(s²+3s+2): a₁=3, a₂=2, b₀=0, b₁=1, b₂=3.','a) Controlável: A=[0 1;−2 −3], B=[0 1]ᵀ, C=[b₂−a₂b₀  b₁−a₁b₀]=<b>[3 1]</b>.','b) Observável: A=[−3 1;−2 0], B=[b₁−a₁b₀; b₂−a₂b₀]=<b>[1 3]ᵀ</b>, C=[1 0].'],S([[0,1],[-2,-3]],[0,1],[3,1],0,[0,0],1));
add(4,'Diagrama de blocos, 1 estado','bd',['Integrador com realimentação −2 e entrada 3u: ẋ=−2x+3u.','Saída: −4x (ganho 4 com sinal −) + 5u (ramo direto): y=−4x+5u ⇒ <b>opção C</b>.'],S([[-2]],[3],[-4],5,[0],1));
add(5,'Diagrama de blocos, 2 estados','bd',['Ler cada integrador: ẋᵢ = Σ(ganho×xⱼ) + bᵢu; y=Σcᵢxᵢ+Du (ramo direto = D).','Montar A (linhas = estados), B, C, D com os ganhos das setas e confirmar sinais dos somadores ⇒ <b>opção B</b>.'],0);
add(6,'Diagrama com 2 estados: modelo e FT','bd',['a) Montar A, B, C do diagrama ⇒ <b>opção C</b>: A=[−3 −1;1 −9], B=[2 3]ᵀ, C=[5 7].','b) G=det[sI−A −B; C D]/det(sI−A), det(sI−A)=s²+12s+28.','Numerador: (s+3)·21 − 15 − 2(−5s−52) = 31s+152 ⇒ <b>G=(31s+152)/(s²+12s+28)</b> (opção C).'],S([[-3,-1],[1,-9]],[2,3],[5,7],0,[0,0],1));
add(7,'Circuito RL/R (1 estado)','ci',['x=i_L. Um só elemento armazenador ⇒ 1 estado.','v₁=L·ẋ; corrente em R₂: v₁/R₂ ⇒ i₁=x+(L/R₂)ẋ.','KVL: u=R₁i₁+v₁=R₁x+(R₁/R₂)Lẋ+Lẋ.','<b>ẋ=−R₁/(L(R₁/R₂+1))·x+1/(L(R₁/R₂+1))·u</b> (opção C). Simulação com R₁=R₂=L=1.'],S([[-0.5]],[0.5],[1],0,[0],1));
add(8,'Circuito LC com fonte de corrente','ci',['x₁=v_C, x₂=i_L (L e C). Equações: i=Cẋ₁+x₂; x₁=Lẋ₂+Rx₂; y=Rx₂.','A=[0 −1/C; 1/L −R/L], B=[1/C 0]ᵀ, C=[0 R] ⇒ <b>a) opção C</b>.','G=det[sI−A −B;C D]/det(sI−A)=R/(LCs²+RCs+1) ⇒ <b>b) opção A</b>. Simulação com R=L=C=1.'],S([[0,-1],[1,-1]],[1,0],[0,1],0,[0,0],1));
add(9,'Circuito com 2 saídas (MIMO de saída)','ci',['x₁=v_C=y₁, x₂=i_L. Dois armazenadores. Usar KVL na malha da fonte e divisor R₂,R₃ para y₂.','a) <b>opção B</b>: A=[0 1/C; −1/L −R₁(R₂+R₃)/(L(R₁+R₂+R₃))], B=[0; (R₂+R₃)/(L(R₁+R₂+R₃))].','b) Com Δ=s²LC(R₁+R₂+R₃)+sR₁(R₂+R₃)C+R₁+R₂+R₃: a matriz de transferência não coincide com A, B nem C ⇒ <b>opção D</b> (outro resultado).'],0);
add(10,'Circuito de 3 estados','ci',['Estados i₁, v₂, i₃ (L₁, C₂, L₃). Equações: u=R₁i₁+L₁i̇₁+R₂i₂+v₂; i₂=C₂v̇₂; i₁=i₂+i₃; y=L₃i̇₃.','Substituir i₂=i₁−i₃ e isolar as derivadas: <b>A=[−(R₁+R₂)/L₁ −1/L₁ R₂/L₁; 1/C₂ 0 −1/C₂; R₂/L₃ 1/L₃ −(R₂+R₃)/L₃]</b>, B=[1/L₁ 0 0]ᵀ, C=[R₂ 1 −(R₂+R₃)].'],0);
add(11,'Circuito com C e L','ci',['x=[v_C i_L]ᵀ; entrada u, saída y; método: KCL no nó entre R₁, R₂ e KVL na malha L–R₃.','Matrizes pela convenção da cadeira (A,B,C,D) conforme o caderno: A=[−1/((R₁+R₂)C) −R₁/((R₁+R₂)C); R₁/(L(R₁+R₂)) −(R₁R₂/(R₁+R₂)+R₃)/L], B=[1/((R₁+R₂)C); R₂/(L(R₁+R₂))], C=[R₁/(R₁+R₂) −R₁R₂/(R₁+R₂)], D=R₂/(R₁+R₂).'],0);
add(12,'e^At, FT e diagrama de blocos','ex',['A=[−6 4;−2 0], B=[0 1]ᵀ, C=[1 0]. λ=−2 e −4.','<b>Cayley-Hamilton</b>: e^(−2t)=α₀−2α₁; e^(−4t)=α₀−4α₁ ⇒ α₁=½(e^(−2t)−e^(−4t)), α₀=2e^(−2t)−e^(−4t).','e^(At)=α₀I+α₁A=[−e^(−2t)+2e^(−4t)  2e^(−2t)−2e^(−4t); −e^(−2t)+e^(−4t)  2e^(−2t)−e^(−4t)].','<b>Laplace</b>: (sI−A)⁻¹=1/((s+2)(s+4))·[s 4; −2 s+6], frações parciais e ℒ⁻¹ dão o mesmo.','b) G=C(sI−A)⁻¹B=2/(s+2)−2/(s+4)=<b>4/((s+2)(s+4))</b>.','c) Diagrama: sX₁=−6X₁+4X₂; sX₂=U−2X₁; Y=X₁ ⇒ [s(s+6)+8]X₁=4U ⇒ mesma G ✓.'],S([[-6,4],[-2,0]],[0,1],[1,0],0,[0,0],1));
add(13,'e^At de matriz triangular','ex',['sI−A=[s+3 0;1 s+2] ⇒ (sI−A)⁻¹=1/((s+3)(s+2))·[s+2 0; −1 s+3].','Elemento (2,1): −1/((s+2)(s+3))=1/(s+3)−1/(s+2).','e^(At)=[e^(−3t) 0; e^(−3t)−e^(−2t)  e^(−2t)] ⇒ <b>opção D</b>.'],S([[-3,0],[-1,-2]],[1,0],[1,0],0,[1,1],0));
add(14,'Valores próprios complexos','st',['det(λI−A)=(λ+2)²+9=λ²+4λ+13=0 ⇒ <b>λ=−2±j3 (a: B)</b>.','Re&lt;0 e Im≠0 ⇒ estável e <b>subamortecido (b: B)</b>.'],S([[-2,3],[-3,-2]],[1,-3],[6,5],0,[1,0],0));
add(15,'Diagrama 1 estado: Q, R, FT','cr',['ẋ=−2x+3u, y=4x. b=3≠0 e c=4≠0 ⇒ <b>controlável e observável (a: A)</b>.','G=4·3/(s+2)=<b>12/(s+2)</b> ⇒ nenhuma das opções dadas: <b>b: D</b>.'],S([[-2]],[3],[4],0,[0],1));
add(16,'Dois sistemas com blocos λ','cr',['Sistema 1: x₂ ligado à entrada; x₁ alimentado por x₂; y=x₁ ⇒ A=[−λ 1;0 −λ], B=[0 1]ᵀ, C=[1 0] ⇒ <b>a: B</b>.','Sistema 2: A igual, B=[1 0]ᵀ, C=[0 1] ⇒ <b>b: C</b>.','Sistema 1: Q=[B AB]=[0 1;1 −λ] det≠0 e R=[1 0;−λ 1] det≠0 ⇒ <b>c: A</b> (controlável e observável).','Sistema 2: a entrada não afeta x₂ e a saída não vê x₁ ⇒ <b>d: D</b> (nem controlável nem observável).'],S([[-1,1],[0,-1]],[0,1],[1,0],0,[0,0],1));
add(17,'Complexos e controlabilidade','cr',['λ²+6λ+13=0 ⇒ <b>λ=−3±j2 (a: C)</b>.','AB=[−9 −7]ᵀ; Q=[1 −9;−3 −7], det Q=−7−27=−34≠0 ⇒ <b>controlável (b: A)</b>.'],S([[-3,2],[-2,-3]],[1,-3],[1,0],0,[1,0],1));
add(18,'Cancelamento polo-zero','ft',['Q=[B AB], AB=[4 18]ᵀ ⇒ det Q=18+12≠0 ⇒ <b>controlável (a: A)</b>.','R=[C;CA]=[−2 1;4 −2], det R=0 ⇒ <b>não observável (b: B)</b>.','G=[−2(s+1)(…)]… numerador −5(s+1), denominador (s+1)(s+2) ⇒ <b>G=−5/(s+2)</b>: o polo −1 foi cancelado.'],S([[1,-1],[6,-4]],[1,-3],[-2,1],0,[0,0],1));
add(19,'Diagrama → diagonal → FT','dg',['a) ẋ₁=−3x₁−x₂−u, ẋ₂=2x₁+u ⇒ A=[−3 −1;2 0], B=[−1 1]ᵀ, C=[2 3] ⇒ <b>opção C</b>.','λ²+3λ+2=0 ⇒ −1, −2. b) Diagonal: <b>opção B</b> (Λ=diag(−1,−2), B̃=[0 −1]ᵀ, C̃=[−4 −1]).','c) Φ(t)=<b>opção C</b>. d) G=(s+1)/((s+1)(s+2))=<b>1/(s+2) (opção A)</b>.','e) b̃₁=0 ⇒ <b>não controlável</b>; c̃ᵢ≠0 ⇒ observável.'],S([[-3,-1],[2,0]],[-1,1],[2,3],0,[0,0],1));
add(20,'3 estados: λ, diagonal e resposta','dg',['A=companheira, det(λI−A)=λ³+5λ²+11λ+15 ⇒ <b>λ=−1±j2, −3</b>.','Vetores: e₁=[1 −1+j2 −3−j4]ᵀ, e₃=[1 −3 9]ᵀ.','b) Diagonal (real): Λ=[−1 2 0;−2 −1 0;0 0 −3], W⁻¹B=1/8·[−1 1 1]ᵀ, CW=[1 0 1].','c) Com x(0)=[5 −1 −7]ᵀ e u=0: <b>x̃(t)=[2e^(−3t)+e^(−t)(3cos2t+4sin2t); −6e^(−3t)+e^(−t)(5cos2t−10sin2t); 18e^(−3t)−25e^(−t)cos2t]</b>.'],S(G3,[0,0,1],[1,0,0],0,[5,-1,-7],0,6));
add(21,'3 estados: diagonal, FT, Q/R, resposta','dg',['λ=−2,−3,−4; e₁=[1 7 12]ᵀ, e₂=[1 6 8]ᵀ, e₃=[1 5 6]ᵀ.','W⁻¹B₁=[−1 −3 6]ᵀ, C₁W=[3 5 5]; W⁻¹B₂=[0 −6 8]ᵀ, C₂W=[−6 0 2].','b) G₁=(12s²+39s+24)/((s+2)(s+3)(s+4)); G₂=16/(s+4).','c) Sistema 1: det Q=72, det R=75 ⇒ controlável e observável. Sistema 2: det Q=det R=0 ⇒ não.','d) x(0)=5e₁+2e₂+3e₃ ⇒ <b>x(t)=5e^(−2t)e₁+2e^(−3t)e₂+3e^(−4t)e₃</b>.'],S(A21,[2,5,0],[1,2,-1],0,[10,62,94],0,3));
add(22,'Diagrama de 3 modos','cr',['Do diagrama (modos desacoplados): A=diag(−1,−2,1), Bᵀ=[1 0 2], C=[2 3 4].','Solução do caderno: estável, não controlável, não observável, G=1/(s+1), y(t) degrau a tender para 1.','⚠ Com A=diag(−1,−2,+1) como impresso, o polo +1 daria instabilidade (como no Ex. 40). Confirma o sinal do 3.º laço no diagrama.'],0);
add(23,'Controlável, Φ(t) e FT','fc',['ÿ+6ẏ+5y=2u: a₁=6, a₂=5, b₂=2. A=[0 1;−5 −6], B=[0 1]ᵀ, C=[2 0].','Φ(t)=[5/4e^(−t)−1/4e^(−5t)  1/4e^(−t)−1/4e^(−5t); −5/4e^(−t)+5/4e^(−5t)  −1/4e^(−t)+5/4e^(−5t)].','<b>G=2/((s+1)(s+5))</b>.'],S([[0,1],[-5,-6]],[0,1],[2,0],0,[0,0],1,8));
add(24,'Observável, Q/R e diagonal','cr',['G=(2s+4)/(s²+4s+3): a₁=4, a₂=3, b₁=2, b₂=4. A=[−4 1;−3 0], B=[2 4]ᵀ, C=[1 0].','Q=[2 −4;4 −6], det=4≠0 ⇒ controlável. R=[1 0;−4 1], det=1≠0 ⇒ observável.','λ=−1,−3; W=[1 1;3 1]: Λ=diag(−1,−3), W⁻¹B=[1 1]ᵀ, CW=[1 1].'],S([[-4,1],[-3,0]],[2,4],[1,0],0,[0,0],1));
add(25,'Motor DC (3 estados)','fc',['Θ/V=0.5/(0.8s³+8.8s²+8.25s) ⇒ ÷0.8: 0.625/(s³+11s²+10.3125s).','a₁=11, a₂=10.3125, a₃=0, b₃=0.625. A=[−11 1 0;−10.3125 0 1;0 0 0], B=[0 0 0.625]ᵀ, C=[1 0 0].','a₃=0 ⇒ polo na origem (θ integra a velocidade). det Q=−0.625³≠0 e det R=1 ⇒ controlável e observável.'],S([[-11,1,0],[-10.3125,0,1],[0,0,0]],[0,0,0.625],[1,0,0],0,[0,0,0],1,10));
add(26,'Diagrama 2 estados','bd',['A=[2 −1;4 0]? Ler linha a linha: ẋ₁=2x₁+4x₂+3u; ẋ₂=−x₁+5u (sinais dos somadores) e y=2x₁+6x₂.','Matrizes do caderno: <b>opção A</b>.'],0);
add(27,'FT sem inverter','ft',['A=[−3 −1;2 0], B=[0 2]ᵀ, C=[−1 0], D=0.','det(sI−A)=s²+3s+2=(s+1)(s+2). Numerador |s+3 1 0;−2 s −2;−1 0 0|=2.','<b>G=2/((s+1)(s+2))</b> (opção B). Confirmação: C(sI−A)⁻¹B=[−s 1]·[0 2]ᵀ/(…).'],S([[-3,-1],[2,0]],[0,2],[-1,0],0,[0,0],1));
add(28,'Sistema MIMO','ft',['G(s)=C(sI−A)⁻¹B é matriz 2×2 (2 entradas, 2 saídas).','Resultado do caderno: G=[4/((s+1)(s+2))  4/(s+2); (s+3)/((s+1)(s+2))  1/(s+2)].'],0);
add(29,'Circuito 4 estados','ci',['x=[i₁ i₂ v₁ v₂]ᵀ (L₁, L₂, C₁, C₂).','Modelo do caderno: A=[−(R₁+R₂)/L₁ R₂/L₁ −1/L₁ −1/L₁; R₂/L₂ −R₂/L₂ 0 1/L₂; 1/C₁ 0 0 0; 1/C₂ −1/C₂ 0 0], B=[1/L₁ 0 0 0]ᵀ, C=[R₂ −R₂ 0 1].'],0);

const det=M=>M.length==1?M[0][0]:M[0].reduce((s,v,j)=>s+(j%2?-1:1)*v*det(M.slice(1).map(q=>q.filter((_,k)=>k!=j))),0);
const mv=(M,v)=>M.map(q=>q.reduce((s,a,i)=>s+a*v[i],0)),tr=M=>M[0].map((_,j)=>M.map(q=>q[j]));
function plot(cv,ts,ser){const d=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;cv.width=W*d;cv.height=H*d;const g=cv.getContext("2d");g.scale(d,d);const all=ser.flatMap(s=>s.y).filter(isFinite);let y0=Math.min(0,...all),y1=Math.max(...all);if(y1-y0<1e-6)y1=y0+1;const t1=ts[ts.length-1],X=t=>34+t/t1*(W-44),Y=v=>H-20-(v-y0)/(y1-y0)*(H-32),cs=getComputedStyle(document.documentElement);g.strokeStyle=cs.getPropertyValue("--bd");g.fillStyle=cs.getPropertyValue("--mu");g.font="11px sans-serif";g.beginPath();g.moveTo(34,Y(0));g.lineTo(W-6,Y(0));g.stroke();g.fillText(r(y1),2,12);g.fillText(r(y0),2,H-22);g.fillText("t="+r(t1)+" s",W/2-20,H-6);ser.forEach(s=>{g.strokeStyle=s.c;g.lineWidth=2;g.beginPath();s.y.forEach((v,i)=>i?g.lineTo(X(ts[i]),Y(v)):g.moveTo(X(ts[i]),Y(v)));g.stroke()})}
function sim(m,cv,out,uu){const {A,B,C,D,x0}=m,n=A.length,N=400,h=m.T/N,u=uu;let x=x0.slice(),ts=[],X=x0.map(()=>[]),Y=[];const f=(x)=>mv(A,x).map((v,i)=>v+B[i]*u);for(let k=0;k<=N;k++){ts.push(k*h);x.forEach((v,i)=>X[i].push(v));Y.push(C.reduce((s,c,i)=>s+c*x[i],0)+D*u);const k1=f(x),k2=f(x.map((v,i)=>v+h/2*k1[i])),k3=f(x.map((v,i)=>v+h/2*k2[i])),k4=f(x.map((v,i)=>v+h*k3[i]));x=x.map((v,i)=>v+h/6*(k1[i]+2*k2[i]+2*k3[i]+k4[i]))}
const cols=[B];for(let i=1;i<n;i++)cols.push(mv(A,cols[i-1]));const Q=cols[0].map((_,i)=>cols.map(c=>c[i])),rows=[C];for(let i=1;i<n;i++)rows.push(mv(tr(A),rows[i-1]));
const dQ=det(Q),dR=det(rows);let p="";if(n==1)p="λ = "+r(A[0][0]);else if(n==2){const t=A[0][0]+A[1][1],d=A[0][0]*A[1][1]-A[0][1]*A[1][0],ds=t*t/4-d;p=ds>=0?"λ = "+r(t/2+Math.sqrt(ds))+" e "+r(t/2-Math.sqrt(ds)):"λ = "+r(t/2)+" ± j"+r(Math.sqrt(-ds))}
const tag=(v,a,b)=>"<span class='"+(Math.abs(v)>1e-9?"ok":"bad")+"'>"+(Math.abs(v)>1e-9?a:b)+"</span>";
out.innerHTML=(p?"<div><b>Polos:</b> "+p+"</div>":"")+"<div><b>det Q</b> = "+r(dQ)+" → "+tag(dQ,"controlável","NÃO controlável")+"</div><div><b>det R</b> = "+r(dR)+" → "+tag(dR,"observável","NÃO observável")+"</div><div class='sm'>Azul/laranja/verde: estados x₁,x₂,x₃; preto: saída y.</div>";
const cl=["#2563eb","#ea580c","#16a34a"];plot(cv,ts,X.map((y,i)=>({y,c:cl[i]})).concat([{y:Y,c:getComputedStyle(document.documentElement).getPropertyValue("--tx")}]))}
let cur=1;
function show(n){cur=n;[...$("nav").children].forEach((b,i)=>b.classList.toggle("on",i+1==n));const e=E[n],m=e.m;
$("ex").innerHTML="<div class='card'><h2>Exercício "+n+" · "+e.t+"</h2><div class='sm'>Teoria necessária: "+e.k.split(" ").map(k=>T[k][0]).join(", ")+"</div>"+e.k.split(" ").map(k=>"<details><summary>📘 "+T[k][0]+"</summary><p>"+T[k][1]+"</p></details>").join("")+"<h3>Resolução passo a passo</h3><ol>"+e.s.map(s=>"<li>"+s+"</li>").join("")+"</ol>"+(m?"<h3>Simulação</h3><div>Entrada: <select id='us'><option value='1'>degrau unitário</option><option value='0'>u = 0 (resposta livre)</option></select></div><canvas id='cv'></canvas><div id='so'></div>":"<div class='sm'>Sem simulação nesta versão: exercício conceptual, MIMO ou com mais de 3 estados.</div>")+"<div class='pn'><button class='go' "+(n>1?"":"disabled")+" id='pv'>← "+(n-1)+"</button><button class='go' "+(n<40?"":"disabled")+" id='nx'>"+(n+1)+" →</button></div></div>";
$("pv").onclick=()=>show(n-1);$("nx").onclick=()=>show(n+1);
if(m){const go=()=>sim(m,$("cv"),$("so"),+$("us").value);$("us").value=m.u?1:0;$("us").onchange=go;go()}scrollTo(0,0)}
for(let i=1;i<=40;i++){const b=document.createElement("button");b.textContent=i;b.onclick=()=>show(i);$("nav").appendChild(b)}
addEventListener("resize",()=>show(cur));show(1);
